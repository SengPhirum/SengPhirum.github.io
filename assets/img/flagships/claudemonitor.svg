<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img"
     aria-label="Claude Organization Usage Monitor logo">
  <!--
    Master logo (full detail, use at 48px and above).
    Concept: an open gauge ring ("C" for Claude / a monitoring dial) whose
    opening is capped by a glowing live-reading dot, with a usage pulse
    running through the centre — adoption being monitored, live.
    Palette: dodgerblue tile (app primary #1E90FF family), cool-white glyph,
    amber reading dot — the complementary accent that also leads the
    categorical chart palette's second slot.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4FA6FF"/>
      <stop offset="0.55" stop-color="#1E90FF"/>
      <stop offset="1" stop-color="#0C63C0"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="dotglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFE1B0" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#F7B955" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#F7B955" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- app tile -->
  <rect x="34" y="34" width="444" height="444" rx="104" fill="url(#tile)"/>
  <rect x="34" y="34" width="444" height="444" rx="104" fill="url(#sheen)"/>

  <!-- gauge ring / "C" (280° arc, opening east), shadow pass then glyph -->
  <path d="M 369.4 351.1 A 148 148 0 1 1 369.4 160.9"
        fill="none" stroke="#0A4C93" stroke-opacity="0.35"
        stroke-width="58" stroke-linecap="round" transform="translate(0,7)"/>
  <path d="M 369.4 351.1 A 148 148 0 1 1 369.4 160.9"
        fill="none" stroke="#F5FAFF" stroke-width="58" stroke-linecap="round"/>

  <!-- usage pulse through the centre -->
  <polyline points="150,256 208,256 236,190 268,314 296,256 348,256"
            fill="none" stroke="#0A4C93" stroke-opacity="0.35" stroke-width="26"
            stroke-linecap="round" stroke-linejoin="round" transform="translate(0,7)"/>
  <polyline points="150,256 208,256 236,190 268,314 296,256 348,256"
            fill="none" stroke="#F5FAFF" stroke-width="26"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- live reading dot capping the gauge opening -->
  <circle cx="404" cy="256" r="62" fill="url(#dotglow)"/>
  <circle cx="404" cy="263" r="36" fill="#0A4C93" fill-opacity="0.35"/>
  <circle cx="404" cy="256" r="36" fill="#F7B955"/>
  <circle cx="404" cy="256" r="13" fill="#FFFBF2"/>
</svg>
